<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="t d">
  <title id="t">Two ways to present proof</title>
  <desc id="d">Abstract illustration comparing a blog-led proof page with a customer-story-led proof page. No real pages or brands are shown.</desc>
  <rect width="1600" height="900" fill="#e2e6e1"/>

  <!-- Left: blog-led -->
  <g font-family="Helvetica, Arial, sans-serif" fill="#1b2340">
    <text x="120" y="110" font-size="30" font-weight="600">Blog-led proof</text>
    <text x="120" y="146" font-size="22" fill="#4a5268">Articles about the industry; outcomes left to the reader</text>
  </g>
  <g transform="translate(120 190)">
    <rect width="620" height="600" fill="#eef0ec" stroke="#c5cbd0" stroke-width="2"/>
    <rect x="0" y="0" width="620" height="44" fill="#ffffff" stroke="#c5cbd0" stroke-width="2"/>
    <circle cx="24" cy="22" r="6" fill="#c5cbd0"/><circle cx="44" cy="22" r="6" fill="#c5cbd0"/><circle cx="64" cy="22" r="6" fill="#c5cbd0"/>
    <!-- three article rows -->
    <g>
      <rect x="40" y="80" width="160" height="110" fill="#c5cbd0"/>
      <rect x="224" y="90" width="300" height="18" fill="#4a5268"/>
      <rect x="224" y="124" width="350" height="12" fill="#c5cbd0"/>
      <rect x="224" y="146" width="320" height="12" fill="#c5cbd0"/>
      <rect x="224" y="168" width="200" height="12" fill="#c5cbd0"/>
    </g>
    <g transform="translate(0 150)">
      <rect x="40" y="80" width="160" height="110" fill="#c5cbd0"/>
      <rect x="224" y="90" width="260" height="18" fill="#4a5268"/>
      <rect x="224" y="124" width="350" height="12" fill="#c5cbd0"/>
      <rect x="224" y="146" width="300" height="12" fill="#c5cbd0"/>
      <rect x="224" y="168" width="230" height="12" fill="#c5cbd0"/>
    </g>
    <g transform="translate(0 300)">
      <rect x="40" y="80" width="160" height="110" fill="#c5cbd0"/>
      <rect x="224" y="90" width="320" height="18" fill="#4a5268"/>
      <rect x="224" y="124" width="350" height="12" fill="#c5cbd0"/>
      <rect x="224" y="146" width="280" height="12" fill="#c5cbd0"/>
      <rect x="224" y="168" width="180" height="12" fill="#c5cbd0"/>
    </g>
  </g>

  <!-- Right: story-led -->
  <g font-family="Helvetica, Arial, sans-serif" fill="#1b2340">
    <text x="860" y="110" font-size="30" font-weight="600">Story-led proof</text>
    <text x="860" y="146" font-size="22" fill="#4a5268">A customer, a problem and a measurable result</text>
  </g>
  <g transform="translate(860 190)">
    <rect width="620" height="600" fill="#eef0ec" stroke="#1b2340" stroke-width="2"/>
    <rect x="0" y="0" width="620" height="44" fill="#ffffff" stroke="#1b2340" stroke-width="2"/>
    <circle cx="24" cy="22" r="6" fill="#c5cbd0"/><circle cx="44" cy="22" r="6" fill="#c5cbd0"/><circle cx="64" cy="22" r="6" fill="#c5cbd0"/>
    <!-- customer story card -->
    <rect x="40" y="76" width="540" height="300" fill="#ffffff" stroke="#c5cbd0" stroke-width="2"/>
    <rect x="68" y="104" width="120" height="40" fill="#1b2340"/>
    <rect x="68" y="172" width="380" height="20" fill="#1b2340"/>
    <rect x="68" y="206" width="440" height="12" fill="#c5cbd0"/>
    <rect x="68" y="228" width="400" height="12" fill="#c5cbd0"/>
    <!-- outcome figures -->
    <g font-family="Helvetica, Arial, sans-serif">
      <rect x="68" y="270" width="140" height="78" fill="#e1e7ee"/>
      <rect x="84" y="286" width="80" height="22" fill="#2d4be0"/>
      <rect x="84" y="320" width="100" height="10" fill="#c5cbd0"/>
      <rect x="226" y="270" width="140" height="78" fill="#e1e7ee"/>
      <rect x="242" y="286" width="70" height="22" fill="#2d4be0"/>
      <rect x="242" y="320" width="100" height="10" fill="#c5cbd0"/>
      <rect x="384" y="270" width="140" height="78" fill="#e1e7ee"/>
      <rect x="400" y="286" width="90" height="22" fill="#2d4be0"/>
      <rect x="400" y="320" width="100" height="10" fill="#c5cbd0"/>
    </g>
    <!-- logo strip -->
    <g fill="#c5cbd0">
      <rect x="40" y="410" width="96" height="36"/><rect x="151" y="410" width="96" height="36"/>
      <rect x="262" y="410" width="96" height="36"/><rect x="373" y="410" width="96" height="36"/>
      <rect x="484" y="410" width="96" height="36"/>
    </g>
    <!-- quote -->
    <rect x="40" y="480" width="4" height="80" fill="#2d4be0"/>
    <rect x="62" y="490" width="420" height="14" fill="#4a5268"/>
    <rect x="62" y="514" width="380" height="14" fill="#4a5268"/>
    <rect x="62" y="544" width="160" height="10" fill="#c5cbd0"/>
  </g>

  <!-- annotation marks on the story-led page -->
  <g font-family="Helvetica, Arial, sans-serif" font-size="20" font-weight="600" fill="#2d4be0">
    <line x1="1460" y1="400" x2="1520" y2="400" stroke="#2d4be0" stroke-width="2"/>
    <circle cx="1536" cy="400" r="14" fill="none" stroke="#2d4be0" stroke-width="2"/><text x="1530" y="407">1</text>
    <line x1="1400" y1="500" x2="1520" y2="500" stroke="#2d4be0" stroke-width="2"/>
    <circle cx="1536" cy="500" r="14" fill="none" stroke="#2d4be0" stroke-width="2"/><text x="1530" y="507">2</text>
    <line x1="1450" y1="618" x2="1520" y2="618" stroke="#2d4be0" stroke-width="2"/>
    <circle cx="1536" cy="618" r="14" fill="none" stroke="#2d4be0" stroke-width="2"/><text x="1530" y="625">3</text>
  </g>
  <g font-family="Helvetica, Arial, sans-serif" font-size="20" fill="#4a5268">
    <text x="860" y="838"><tspan fill="#2d4be0" font-weight="600">1</tspan> Who the customer is</text>
    <text x="1078" y="838"><tspan fill="#2d4be0" font-weight="600">2</tspan> The result in numbers</text>
    <text x="1310" y="838"><tspan fill="#2d4be0" font-weight="600">3</tspan> Logos and a quote</text>
  </g>
</svg>
